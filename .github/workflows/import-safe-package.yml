name: Import safe package

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import archive
        run: |
          set -euo pipefail
          curl -fsSL "https://emechnet.org/github-imports/github-imports-20260814145522-4155/pastenator.tar.gz" -o /tmp/package.tar.gz
          find . -mindepth 1 ! -name .git ! -path './.git/*' -exec rm -rf {} +
          tar -xzf /tmp/package.tar.gz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial safe public package"
          git push
