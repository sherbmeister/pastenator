name: Import safe package v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import archive
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://emechnet.org/github-imports/github-imports-20260814145522-4155/pastenator.tar.gz" -o /tmp/package.tar.gz
          shopt -s dotglob nullglob
          for item in * .*; do
            [ "$item" = "." ] && continue
            [ "$item" = ".." ] && continue
            [ "$item" = ".git" ] && continue
            rm -rf "$item"
          done
          tar -xzf /tmp/package.tar.gz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial safe public package"
          git push
